name: Verify no-hardware build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Frozen dependencies; no lifecycle hooks
        run: bun install --frozen-lockfile --ignore-scripts
      - name: TypeScript and model checks
        run: bun run check
      - name: Rust formatting, lint, and fault tests
        run: |
          cargo fmt --manifest-path device/Cargo.toml -- --check
          cargo clippy --manifest-path device/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path device/Cargo.toml --locked
      - name: Build and verify installed-style app and private worker
        run: |
          bun run build
          for package in dist/jazzkeys-*; do bun packaging/verify-package.ts "$package"; bun packaging/smoke.ts "$package"; done
          bun run build:bundle
      - name: Upload validation evidence (binary distribution remains gated)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jazzkeys-demo-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*/manifest.json
            artifacts/
          if-no-files-found: error
          retention-days: 14
