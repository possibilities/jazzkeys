name: Native demo screenshots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Capture actual native demo and exercise controls
        run: bun run test:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jazzkeys-native-demo-${{ github.sha }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 14
