name: Mac Launch Services check
on:
  push:
    branches: [main]
    paths:
      - packaging/mac-launch-check-version.txt
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: mac-launch-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  launch:
    if: github.repository == 'possibilities/jazzkeys' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.16
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Build and seal the exact native application
        run: |
          bun run build
          bun run build:bundle
      - name: Re-extract the current app from its verified release-format ZIP
        run: |
          python3 packaging/mac-release.py --bundle dist/install/macos-arm64 --output "$RUNNER_TEMP/launch-assets"
          mkdir -p dist/launch-current
          ditto -x -k "$RUNNER_TEMP/launch-assets/JazzKeys-demo-macos-arm64-$GITHUB_SHA.zip" dist/launch-current
          cp dist/install/macos-arm64/bundle-manifest.json dist/launch-current/bundle-manifest.json
          bun packaging/verify-bundle.ts dist/launch-current
          codesign --verify --deep --strict dist/launch-current/JazzKeys.app
      - name: Fetch the exact published demo.2 baseline for comparison
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/demo2.zip" 'https://github.com/possibilities/jazzkeys/releases/download/v0.1.0-demo.2-a3c575fd83a0-37502063980/Jazzkeys-demo-macos-arm64-a3c575fd83a01d546fe6bac6e5145739d4fbe09e.zip'
          printf '42a83da9eb8240529348d84c822cdcebb1b2b735a1efe37d6911c78cf2e52460  %s\n' "$RUNNER_TEMP/demo2.zip" | shasum -a 256 -c -
          mkdir -p dist/launch-baseline
          ditto -x -k "$RUNNER_TEMP/demo2.zip" dist/launch-baseline
          codesign --verify --deep --strict dist/launch-baseline/Jazzkeys.app
      - name: Compile metadata-only and bounded-launch probes
        run: |
          mkdir -p artifacts/mac-launch
          cc -O2 -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreServices packaging/mac-bundle-info.m -o "$RUNNER_TEMP/mac-bundle-info"
          cc -O2 -Wall -Wextra -Werror -fobjc-arc -fblocks -framework AppKit -framework CoreGraphics packaging/mac-launch-check.m -o "$RUNNER_TEMP/mac-launch-check"
      - name: Inspect the published baseline without loading its code
        continue-on-error: true
        run: '"$RUNNER_TEMP/mac-bundle-info" "$GITHUB_WORKSPACE/dist/launch-baseline/Jazzkeys.app" Jazzkeys | tee artifacts/mac-launch/baseline-info.json'
      - name: Launch and quit the published baseline for comparison
        continue-on-error: true
        run: '"$RUNNER_TEMP/mac-launch-check" "$GITHUB_WORKSPACE/dist/launch-baseline/Jazzkeys.app" "$GITHUB_WORKSPACE/artifacts/mac-launch/baseline-launch.json"'
      - name: Require baseline cleanup before testing the new archive
        run: |
          python3 - <<'PY_CHECK'
          import json
          result = json.load(open('artifacts/mac-launch/baseline-launch.json'))
          assert result['cleanupUncertain'] is False
          assert not result['identityMatched'] or result['terminated']
          PY_CHECK
      - name: Record Mach-O header and load commands
        run: otool -hv -l dist/launch-current/JazzKeys.app/Contents/MacOS/jazzkeys > artifacts/mac-launch/macho.txt
      - name: Inspect native bundle recognition without loading code
        id: metadata
        continue-on-error: true
        run: '"$RUNNER_TEMP/mac-bundle-info" "$GITHUB_WORKSPACE/dist/launch-current/JazzKeys.app" | tee artifacts/mac-launch/bundle-info.json'
      - name: Coordinated bounded Launch Services open and quit
        run: '"$RUNNER_TEMP/mac-launch-check" "$GITHUB_WORKSPACE/dist/launch-current/JazzKeys.app" "$GITHUB_WORKSPACE/artifacts/mac-launch/launch.json"'
      - name: Require metadata recognition as well as the live result
        if: steps.metadata.outcome != 'success'
        run: exit 1
      - name: Retain only bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jazzkeys-mac-launch-${{ github.sha }}
          path: artifacts/mac-launch/
          if-no-files-found: error
          retention-days: 14
