name: Mac Launch Services check
on:
  push:
    branches: [main]
    paths:
      - packaging/mac-launch-check-version.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-launch-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  launch:
    if: github.repository == 'possibilities/jazzkeys' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Build and seal the exact native application
        run: |
          bun run build
          bun run build:bundle
      - name: Compile metadata-only and bounded-launch probes
        run: |
          mkdir -p artifacts/mac-launch
          cc -O2 -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreServices packaging/mac-bundle-info.m -o "$RUNNER_TEMP/mac-bundle-info"
          cc -O2 -Wall -Wextra -Werror -fobjc-arc -fblocks -framework AppKit -framework CoreGraphics packaging/mac-launch-check.m -o "$RUNNER_TEMP/mac-launch-check"
      - name: Record Mach-O header and load commands
        run: otool -hv -l dist/install/macos-arm64/JazzKeys.app/Contents/MacOS/jazzkeys > artifacts/mac-launch/macho.txt
      - name: Inspect native bundle recognition without loading code
        id: metadata
        continue-on-error: true
        run: '"$RUNNER_TEMP/mac-bundle-info" "$GITHUB_WORKSPACE/dist/install/macos-arm64/JazzKeys.app" > artifacts/mac-launch/bundle-info.json'
      - name: Coordinated bounded Launch Services open and quit
        run: '"$RUNNER_TEMP/mac-launch-check" "$GITHUB_WORKSPACE/dist/install/macos-arm64/JazzKeys.app" "$GITHUB_WORKSPACE/artifacts/mac-launch/launch.json"'
      - name: Require metadata recognition as well as the live result
        if: steps.metadata.outcome != 'success'
        run: exit 1
      - name: Retain only bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jazzkeys-mac-launch-${{ github.sha }}
          path: artifacts/mac-launch/
          if-no-files-found: error
          retention-days: 14
