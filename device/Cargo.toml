[package]
name = "jazzkeys-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Fail-closed, intent-only Jazzkeys device worker (no hardware backend)"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
